name: Deploy Vite Static Site to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# 設定 GITHUB_TOKEN 權限以部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝專案依賴 (npm ci)
        run: npm ci

      - name: 構建 Vite 靜態產物 (npm run build)
        run: npm run build

      - name: 建立 404.html 與 .nojekyll 避免 404 錯誤
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 dist 構建產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
